name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  # Versiones de las herramientas de CI, fijadas para que el resultado sea reproducible.
  GOCOVMERGE_VERSION: b5bfa59ec0ad # github.com/wadey/gocovmerge (sin releases; commit de 2016-03-31)
  GOCOVER_COBERTURA_VERSION: v1.5.0
  GOVULNCHECK_VERSION: v1.9.0
  DIFF_COVER_VERSION: 11.0.2
  SEMGREP_VERSION: 1.185.0
  COVERAGE_THRESHOLD: "85"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      # El smoke test de enrutamiento valida contra un broker real lo que las pruebas con canal
      # simulado no pueden demostrar (ruteo por routing key, reintentos y DLQ).
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover necesita el historial para comparar con la rama base del PR.
          fetch-depth: 0

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      - name: Descargar dependencias
        run: go mod download

      - name: Compilar
        run: CGO_ENABLED=0 go build ./...

      # El tag smoke compila las pruebas contra el broker real.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags smoke ./...

      - name: Pruebas unitarias con cobertura
        run: go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-unit.out

      - name: Smoke test de enrutamiento con cobertura (RabbitMQ real)
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: go test -tags smoke ./internal/smoke/... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-smoke.out

      - name: Unir perfiles y convertir a Cobertura XML
        run: |
          go install "github.com/wadey/gocovmerge@${GOCOVMERGE_VERSION}"
          go install "github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}"
          gocovmerge coverage-unit.out coverage-smoke.out > coverage.out
          # El tag es necesario: sin él gocover-cobertura no encuentra los archivos que solo existen
          # con "smoke".
          GOFLAGS=-tags=smoke gocover-cobertura < coverage.out > coverage.xml

      # Se publica en el resumen del job. El gate sobre el total entra con el PR de cobertura.
      - name: Publicar la cobertura total
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')"
          {
            echo "## Cobertura total"
            echo
            echo "**${total}** de las sentencias (pruebas unitarias y smoke unidas)."
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out > coverage-func.txt

      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: |
            coverage.out
            coverage.xml
            coverage-func.txt
          if-no-files-found: ignore

      # Solo en PR: en un push no hay rama contra la que comparar.
      - name: Gate de cobertura sobre el código nuevo
        if: github.event_name == 'pull_request'
        env:
          # Por variable de entorno y no interpolado en el script: el nombre de la rama lo
          # controla quien abre el PR (inyección de shell).
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --quiet "diff-cover==${DIFF_COVER_VERSION}"
          git fetch --no-tags origin "$BASE_REF"
          status=0
          diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under="${COVERAGE_THRESHOLD}" \
            --format "markdown:diff-cover.md" || status=$?
          {
            echo "## Cobertura del código nuevo (mínimo ${COVERAGE_THRESHOLD} %)"
            echo
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"

      # Falla ante vulnerabilidades alcanzables. No actualiza dependencias.
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      # Las excepciones viven solo en .trivyignore, con el motivo y la fecha de revisión.
      - name: Trivy (vulnerabilidades, secretos y configuración)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # Informativo por ahora: no corta el job. Pasa a gate en v0.14.
      - name: Semgrep
        continue-on-error: true
        run: |
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/default --json --output semgrep.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          results = json.load(open("semgrep.json")).get("results", [])
          por_severidad = collections.Counter(r["extra"]["severity"] for r in results)
          print("## Semgrep (informativo)")
          print()
          if not results:
              print("Sin hallazgos.")
          else:
              print(f"{len(results)} hallazgos: " + ", ".join(f"{n} {s}" for s, n in sorted(por_severidad.items())))
              print()
              for r in results[:20]:
                  print(f"- `{r['path']}:{r['start']['line']}` {r['check_id']}")
          PY
